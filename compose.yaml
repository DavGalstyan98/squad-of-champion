# Local development/reviewer configuration. Not a production deployment.
name: squad-of-champions

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

x-container-environment: &container-environment
  NODE_ENV: production
  PORT: 3001
  DATABASE_URL: postgresql://squad:squad_local@postgres:5432/squad
  REDIS_URL: redis://redis:6379
  CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: squad
      POSTGRES_PASSWORD: squad_local
      POSTGRES_DB: squad
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 20s

  initialize:
    build: *backend-build
    env_file: backend/.env
    environment: *container-environment
    entrypoint: ['/bin/sh', '-ec']
    command:
      ['node dist/database/migration-command.js run; exec node dist/database/seed-command.js']
    init: true
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 20s

  api:
    build: *backend-build
    env_file: backend/.env
    environment: *container-environment
    init: true
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    volumes:
      - jwt_data:/var/lib/squad/jwt
    depends_on:
      initialize:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 20s

volumes:
  postgres_data:
  redis_data:
  jwt_data:
